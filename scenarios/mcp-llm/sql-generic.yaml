scenarios:
  - id: SQL-001
    name: Search paid orders
    category: sql
    variant: mcp_llm
    server: sql-generic
    prompt: Find up to 5 paid orders and summarize how many were returned.
    expected_tools:
      - filter_rows
    expected_tool_family: db_read
    expected_capability: filtered_select
    expected_arguments:
      table: orders
      column: status
      operator: eq
      value: paid
      limit: 5
    expected_result_shape:
      type: list
      maxCount: 5
      fields:
        - id
        - status
        - total_amount
    success_criteria:
      - toolCallSuccess == true
      - wszystkie zwrócone rekordy mają status == "paid"
      - finalAnswerValidJson == true
    metrics:
      - latencyMs
      - tokenUsage
      - toolSelectionAccuracy
      - argumentCorrectness
      - finalAnswerValidJson
    iterations: 10
    deterministic: false
    external:
      mcp-gating-eval:
        note: zadanie eksportowalne do tests.json (tryby full/toggle/act)
    notes: "Same task/prompt/data; generic single-predicate interface. Shape
      describes the intermediate tool output; task oracle checks the completed
      goal. Client/model completes filtering, sorting or aggregation. Read all
      15 seed rows; pagination required for larger fixtures."
    minimum_tool_calls: 1
    deterministic_plan: []
    result_transform: none
