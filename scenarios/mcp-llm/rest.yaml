
scenarios:
  - id: REST-001
    name: Health check
    category: rest
    variant: mcp_llm
    server: rest-api
    prompt: "Check the health of the local REST API. Return structured JSON with the reported status."
    expected_tools: [rest_health_check]
    expected_tool_family: health
    expected_capability: health
    expected_arguments: {}
    success_criteria:
      - toolCallSuccess == true; status == "ok"
      - finalAnswerValidJson == true
    metrics: [latencyMs, tokenUsage, toolSelectionAccuracy, argumentCorrectness, finalAnswerValidJson]
    iterations: 10
    deterministic: false

  - id: REST-002
    name: List products
    category: rest
    variant: mcp_llm
    server: rest-api
    prompt: "Fetch the list of products from the local REST API and report how many there are. Return structured JSON with fields: count."
    expected_tools: [rest_get_products]
    expected_tool_family: list
    expected_capability: list
    expected_arguments: {}
    success_criteria:
      - toolCallSuccess == true
      - count == expected.productsCount z seed.json
      - finalAnswerValidJson == true
    metrics: [latencyMs, tokenUsage, toolSelectionAccuracy, argumentCorrectness, finalAnswerCorrectness]
    iterations: 10
    deterministic: false

  - id: REST-003
    name: Get product 3
    category: rest
    variant: mcp_llm
    server: rest-api
    prompt: "Get the details of product with id 3 from the local REST API. Return the product as structured JSON."
    expected_tools: [rest_get_product]
    expected_tool_family: get_by_id
    expected_capability: get_by_id
    expected_arguments: { id: 3 }
    success_criteria:
      - toolCallSuccess == true; pola zgodne z expected.productId3
      - finalAnswerValidJson == true
    metrics: [latencyMs, tokenUsage, toolSelectionAccuracy, argumentCorrectness, finalAnswerValidJson]
    iterations: 10
    deterministic: false

  - id: REST-004
    name: Create test order
    category: rest
    variant: mcp_llm
    server: rest-api
    prompt: "Create a test order in the local REST API: product 3, quantity 2, customer 'Jan Testowy'. Confirm the created order. Return structured JSON."
    expected_tools: [rest_create_order]
    expected_tool_family: create
    expected_capability: create
    expected_arguments: { productId: 3, quantity: 2, customerName: Jan Testowy }
    success_criteria:
      - toolCallSuccess == true (HTTP 201); zamówienie widoczne w GET /orders
      - /metrics pokazuje dokładnie oczekiwaną liczbę wywołań (unnecessaryToolCalls)
      - finalAnswerValidJson == true
    metrics: [latencyMs, tokenUsage, toolSelectionAccuracy, argumentCorrectness, numberOfToolCalls, unnecessaryToolCalls]
    iterations: 10
    deterministic: false
    notes: Kopia stanu odtwarzana restartem API przed przebiegiem.
