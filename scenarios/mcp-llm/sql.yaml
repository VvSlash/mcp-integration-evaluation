scenarios:
  - id: SQL-001
    name: Search paid orders
    category: sql
    variant: mcp_llm
    server: sql-controlled
    prompt: Find up to 5 paid orders and summarize how many were returned.
    expected_tools:
      - pg_search_orders
    expected_tool_family: db_read
    expected_capability: filtered_select
    expected_arguments:
      status: paid
      limit: 5
    expected_result_shape:
      type: list
      minCount: 1
      maxCount: 5
      fields:
        - id
        - status
        - total_amount
    success_criteria:
      - toolCallSuccess == true
      - wszystkie zwrócone rekordy mają status == "paid"
      - finalAnswerValidJson == true
    metrics:
      - latencyMs
      - tokenUsage
      - toolSelectionAccuracy
      - argumentCorrectness
      - finalAnswerValidJson
    iterations: 10
    deterministic: false
    external:
      mcp-gating-eval:
        note: zadanie eksportowalne do tests.json (tryby full/toggle/act)
    notes: Migracja PG-001, prompt 1:1 z runnera.
  - id: SQL-002
    name: Search shipped orders
    category: sql
    variant: mcp_llm
    server: sql-controlled
    prompt: Find shipped orders. Return only structured JSON.
    expected_tools:
