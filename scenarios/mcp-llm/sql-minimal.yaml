scenarios:
  - id: SQL-001
    name: Search paid orders
    category: sql
    variant: mcp_llm
    server: sql-minimal
    prompt: Find up to 5 paid orders and summarize how many were returned.
    expected_tools:
      - execute_read_query
    expected_tool_family: db_read
    expected_capability: filtered_select
    expected_arguments:
      sql: SELECT … WHERE status = 'paid' … LIMIT 5
    expected_result_shape:
      type: list
      minCount: 1
      maxCount: 5
    success_criteria:
      - toolCallSuccess == true
      - wszystkie zwrócone rekordy mają status == "paid"
      - finalAnswerValidJson == true
    metrics:
      - latencyMs
      - tokenUsage
      - toolSelectionAccuracy
      - argumentCorrectness
      - finalAnswerValidJson
    iterations: 10
    deterministic: false
    notes: >
      Migracja PG-001. Dla surowego SQL argumentCorrectness ocenia się po
      skutku zapytania, nie po dosłownym tekście — wpis
      expected_arguments.sql jest poglądowy.
  - id: SQL-002
    name: Search shipped orders
    category: sql
    variant: mcp_llm
    server: sql-minimal
    prompt: Find shipped orders. Return only structured JSON.
    expected_tools:
      - execute_read_query
    expected_tool_family: db_read
    expected_capability: filtered_select
    expected_arguments:
      sql: SELECT … WHERE status = 'shipped' …
    success_criteria:
      - toolCallSuccess == true
      - wszystkie zwrócone rekordy mają status == "shipped"
      - finalAnswerValidJson == true
    metrics:
      - latencyMs
      - tokenUsage
      - toolSelectionAccuracy
      - argumentCorrectness
      - finalAnswerValidJson
    iterations: 10
    deterministic: false
    notes: Migracja PG-002.
    expected_result_shape:
      type: list
      minCount: 1
      fields:
        - id
        - status
        - total_amount
  - id: SQL-003
    name: Search orders by amount range
    category: sql
    variant: mcp_llm
    server: sql-minimal
    prompt: Find orders with total amount between 300 and 1000 PLN. Return the
      number of matching records and the most relevant fields.
    expected_tools:
      - execute_read_query
    expected_tool_family: db_read
    expected_capability: filtered_select
    expected_arguments:
      sql: SELECT … WHERE total_amount BETWEEN 300 AND 1000 …
    success_criteria:
      - toolCallSuccess == true
      - wszystkie total_amount w zakresie 300–1000
      - finalAnswerValidJson == true
    metrics:
      - latencyMs
      - tokenUsage
      - toolSelectionAccuracy
      - argumentCorrectness
      - finalAnswerValidJson
    iterations: 10
    deterministic: false
    notes: Migracja PG-003.
    expected_result_shape:
      type: list
      minCount: 1
      fields:
        - id
        - status
        - total_amount
  - id: SQL-004
    name: Search recent orders without status filter
    category: sql
    variant: mcp_llm
    server: sql-minimal
    prompt: Find recent orders without filtering by status. Limit the result to 10
      records.
    expected_tools:
      - execute_read_query
    expected_tool_family: db_read
    expected_capability: sorted_select
    expected_arguments:
      sql: SELECT … ORDER BY created_at DESC LIMIT 10
    success_criteria:
      - toolCallSuccess == true
      - rekordy posortowane malejąco po created_at
      - finalAnswerValidJson == true
    metrics:
      - latencyMs
      - tokenUsage
      - toolSelectionAccuracy
      - argumentCorrectness
      - finalAnswerValidJson
    iterations: 10
    deterministic: false
    notes: Migracja PG-004.
    expected_result_shape:
      type: list
      minCount: 1
      fields:
        - id
        - status
        - total_amount
  - id: SQL-005
    name: Total value of paid orders per currency (schema-driven)
    category: sql
    variant: mcp_llm
    server: sql-minimal
    prompt: Based on the database schema, compute the total value of paid orders per
      currency. Return the result as structured JSON.
    expected_tools:
      - execute_read_query
    expected_tool_family: db_read
    expected_capability: aggregation
    expected_arguments:
      sql: SELECT currency, SUM(total_amount) … WHERE status = 'paid' GROUP BY
        currency
    success_criteria:
      - LLM samodzielnie generuje SQL z GROUP BY currency (po odczycie zasobu
        postgres://schema)
      - wynik zgodny z wartością referencyjną z bazy
    metrics:
      - latencyMs
      - tokenUsage
      - toolSelectionAccuracy
      - argumentCorrectness
      - finalAnswerCorrectness
      - resourceReadCount
    iterations: 10
    deterministic: false
    notes: >
      Niewykonalny w wariancie controlled. Wymaga zasobu postgres://schema.
      Metryka resourceReadCount (PROPOSED_METRICS): czy model czyta schemat
      przed konstrukcją zapytania.
    expected_result_shape:
      type: list
      minCount: 1
  - id: SQL-006
    name: Insert test order and confirm it exists
    category: sql
    variant: mcp_llm
    server: sql-minimal
    prompt: Add a test order for customer 'Jan Testowy' (amount 123.45 PLN, status
      pending) and then confirm it exists by reading it back. Return the result
      as structured JSON.
    expected_tools:
      - execute_write_query
      - execute_read_query
    expected_tool_family: db_write
    expected_capability: insert_then_select
    expected_arguments:
      sql: INSERT INTO orders … ; SELECT … WHERE customer_name = 'Jan Testowy'
    success_criteria:
      - rekord istnieje po zapisie (SELECT go zwraca)
      - iteracja czyszczona po teście (seed odtwarzalny —
        setup_postgres_data.ps1)
    metrics:
      - latencyMs
      - tokenUsage
      - toolSelectionAccuracy
      - argumentCorrectness
      - numberOfToolCalls
    iterations: 10
    deterministic: false
    notes: >
      Zapis niewykonalny w wariancie controlled. Wyłącznie izolowana baza
      syntetyczna.
    minimum_tool_calls: 2
    expected_result_shape:
      type: list
      minCount: 1
  - id: SQL-007
    name: Order statistics grouped by status
    category: sql
    variant: mcp_llm
    server: sql-minimal
    prompt: "Compute order statistics grouped by status: order count, total amount
      and average amount per group. Return the result as structured JSON."
    expected_tools:
      - execute_read_query
    expected_tool_family: db_read
    expected_capability: aggregation
    expected_arguments:
      sql: SELECT status AS group_value, COUNT(*)::int AS order_count,
        SUM(total_amount) AS total_amount_sum, ROUND(AVG(total_amount), 2) AS
        total_amount_avg FROM orders GROUP BY status ORDER BY status
    expected_result_shape:
      type: list
      minCount: 1
      fields:
        - group_value
        - order_count
        - total_amount_sum
        - total_amount_avg
    success_criteria:
      - toolCallSuccess == true
      - agregaty zgodne z wartościami referencyjnymi z bazy
      - finalAnswerValidJson == true
    metrics:
      - latencyMs
      - tokenUsage
      - toolSelectionAccuracy
      - argumentCorrectness
      - finalAnswerValidJson
    iterations: 10
    deterministic: false
    notes: Nowy scenariusz — nowy identyfikator, nie pochodzi z migracji PG-00x.
    minimum_tool_calls: 1
